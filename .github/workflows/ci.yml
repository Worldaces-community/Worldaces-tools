name: Validate tools

on:
  pull_request:
    paths:
      - "tools/**"
  push:
    branches: [main]
    paths:
      - "tools/**"

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tool: [ledger_bars]
        # Add the folder name of each new testable Python tool here.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tool dependencies
        run: |
          cd tools/${{ matrix.tool }}
          pip install -r requirements.txt

      - name: Run tool on its example input
        run: |
          cd tools/${{ matrix.tool }}
          python "${{ matrix.tool }}.py" --input example_input.json --out /tmp/output.png

      - name: Check metadata.json is valid JSON (if present)
        run: |
          cd tools/${{ matrix.tool }}
          if [ -f metadata.json ]; then python -m json.tool metadata.json > /dev/null; fi

  roster-analyst:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/roster_analyst
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: tools/roster_analyst/package-lock.json

      - run: npm ci

      - name: Typecheck (CLI + browser bundle)
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Run the CLI on the example roster
        run: npm run analyze -- example_roster.csv example_params.json --md /tmp/report.md && test -s /tmp/report.md

      - name: Build the browser app
        run: npm run build:browser && test -s web/dist/app.js && test -s web/dist/worker.js

      - name: Check metadata.json is valid JSON
        run: python -m json.tool metadata.json > /dev/null
